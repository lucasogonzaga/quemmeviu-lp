name: Instalar chave de deploy restrita (uso unico)
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: Chave publica nova
        required: true
jobs:
  install:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.VPS_HOST }}
      USER_: ${{ secrets.VPS_USER }}
      SITE_PATH: ${{ secrets.VPS_PATH }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PUBKEY: ${{ inputs.pubkey }}
    steps:
      - run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/k "$USER_@$HOST" "sudo bash -s" <<EOF
          set -e
          cat > /usr/local/bin/lp-rsync-only <<'WRAP'
          #!/bin/bash
          # Chave de deploy da LP: aceita somente rsync em modo servidor gravando em $SITE_PATH.
          deny() { echo "comando negado" >&2; exit 1; }
          cmd="\$SSH_ORIGINAL_COMMAND"
          case "\$cmd" in "rsync --server "*) ;; *) deny;; esac
          case "\$cmd" in *[';&|\$\`<>()']*) deny;; esac
          read -ra a <<< "\$cmd"
          last="\${a[-1]}"
          [ "\${last%/}" = "$SITE_PATH" ] || deny
          for x in "\${a[@]:0:\${#a[@]}-1}"; do case "\$x" in */*) deny;; esac; done
          exec "\${a[@]}"
          WRAP
          chmod 755 /usr/local/bin/lp-rsync-only
          install -d -m 700 -o $USER_ -g $USER_ /home/$USER_/.ssh
          grep -qF "$PUBKEY" /home/$USER_/.ssh/authorized_keys || echo "restrict,command=\"/usr/local/bin/lp-rsync-only\" $PUBKEY" >> /home/$USER_/.ssh/authorized_keys
          tail -n 2 /home/$USER_/.ssh/authorized_keys | cut -c1-120
          cat /usr/local/bin/lp-rsync-only | head -5
          EOF
      - if: always()
        run: rm -f ~/.ssh/k

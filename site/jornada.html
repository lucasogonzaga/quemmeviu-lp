<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornada GCC | Quem Me Viu</title>
<meta name="description" content="Responda algumas perguntas e descubra o próximo passo da sua empresa na Jornada GCC.">
<meta name="robots" content="index, follow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preload" href="fonts/151a53ae17.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
body{margin:0;background:#0d1d4f;color:#eef3f7;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#4ff59a;text-decoration:none}a:hover{color:#9dffc6}
:focus-visible{outline:3px solid #4ff59a;outline-offset:3px;border-radius:8px}
</style>
</helmet>

<div style="min-height:100vh;background:radial-gradient(ellipse 70% 45% at 50% 0%,rgba(79,245,154,.12),rgba(13,29,79,0) 70%),#0d1d4f;display:flex;flex-direction:column;overflow-x:clip">

<header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px clamp(20px,5vw,72px)">
  <a href="./" style="display:flex"><img src="logos/logo-quem-me-viu.svg" alt="Quem Me Viu" style="height:32px;width:auto"></a>
</header>

<main style="flex:1;width:100%;max-width:1120px;margin:0 auto;padding:12px clamp(20px,5vw,48px) 72px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px">

  <div data-screen-label="Trilho" style="display:flex;flex-direction:column">
    <div style="position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,24px)">
      <div style="position:absolute;top:19px;left:16.67%;right:16.67%;height:3px;border-radius:3px;background:rgba(238,243,247,.12)"></div>
      <div style="position:absolute;top:19px;left:16.67%;width:{{ fillW }};height:3px;border-radius:3px;background:#4ff59a;box-shadow:0 0 12px rgba(79,245,154,.6);transition:{{ railTr }}"></div>
      <div style="position:absolute;top:8px;left:{{ markerLeft }};width:25px;height:25px;margin-left:-12.5px;border-radius:50%;background:#4ff59a;border:5px solid #0d1d4f;box-sizing:border-box;box-shadow:0 0 0 2px #4ff59a,0 0 26px rgba(79,245,154,.9);z-index:2;opacity:{{ markerOp }};transition:{{ markerTr }}"></div>
      <sc-for list="{{ stages }}" as="s" hint-placeholder-count="3">
        <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
          <span style="width:40px;height:40px;border-radius:50%;background:{{ s.nodeBg }};border:2px solid {{ s.nodeBorder }};color:{{ s.nodeColor }};display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:800;font-size:15px;box-shadow:0 0 0 6px #0d1d4f;transition:background .4s,border-color .4s,color .4s">{{ s.n }}</span>
          <span style="font-family:Sora,sans-serif;font-weight:600;font-size:clamp(13px,1.6vw,17px);line-height:1.25;color:{{ s.color }};text-wrap:balance;transition:color .4s">{{ s.name }}</span>
          <sc-if value="{{ s.here }}" hint-placeholder-val="{{ false }}">
            <span style="padding:5px 12px;border-radius:99px;background:#4ff59a;color:#06120b;font-size:12px;font-weight:700;white-space:nowrap">Você está aqui</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,24px);height:28px;margin-top:10px">
      <div style="display:flex;justify-content:center"><span style="width:2px;height:100%;background:#4ff59a"></span></div>
      <div style="display:flex;justify-content:center"><span style="width:2px;height:100%;background:#4ff59a"></span></div>
      <div style="display:flex;justify-content:center"><span style="width:2px;height:100%;background:#4ff59a"></span></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:14px 20px;border-radius:18px;background:#4ff59a;color:#0d1d4f;text-align:center">
      <span style="font-family:Sora,sans-serif;font-weight:700;font-size:clamp(15px,1.7vw,19px)">Apoio jurídico, técnico e operacional da Quem Me Viu</span>
    </div>
  </div>

  <div style="position:relative;overflow:hidden;padding:4px 20px 32px;margin:0 -20px -28px">
    <div style="transform:{{ panelTf }};opacity:{{ panelOp }};transition:{{ panelTr }}">

      <sc-if value="{{ isQuestion }}" hint-placeholder-val="{{ true }}">
        <div data-screen-label="Pergunta" style="display:flex;flex-direction:column;gap:28px;padding-top:clamp(20px,4vw,40px)">
          <div style="display:flex;flex-direction:column;gap:12px">
            <h1 tabIndex="-1" ref="{{ headRef }}" style="margin:0;font-family:Sora,sans-serif;font-weight:700;font-size:clamp(28px,3.8vw,46px);line-height:1.1;letter-spacing:-.02em;text-wrap:balance;max-width:860px;outline:none">{{ q.title }}</h1>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px">
            <sc-for list="{{ q.options }}" as="o" hint-placeholder-count="3">
              <button onClick="{{ o.pick }}" style="display:flex;align-items:center;gap:16px;min-height:96px;padding:22px 24px;border-radius:20px;border:{{ o.bd }};box-shadow:{{ o.sh }};background:{{ o.bg }};color:#eef3f7;font:inherit;font-size:18px;font-weight:500;line-height:1.3;text-align:left;cursor:pointer;transition:background .2s,border-color .2s,transform .2s" style-hover="background:rgba(79,245,154,.1);border-color:#4ff59a;transform:translateY(-2px)">
                <span style="flex:1;text-wrap:pretty">{{ o.label }}</span>
                <span style="color:#4ff59a;font-size:20px">→</span>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isResult }}" hint-placeholder-val="{{ false }}">
        <div data-screen-label="Resultado" style="display:flex;flex-direction:column;gap:28px;padding-top:clamp(20px,4vw,36px)">
          <div style="display:flex;flex-direction:column;gap:14px">
            <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#4ff59a;font-weight:700">Seu resultado</span>
            <h1 tabIndex="-1" ref="{{ headRef }}" style="margin:0;font-family:Sora,sans-serif;font-weight:800;font-size:clamp(34px,4.6vw,56px);line-height:1.04;letter-spacing:-.03em;text-wrap:balance;outline:none">{{ r.title }}</h1>
            <p style="margin:0;font-size:20px;line-height:1.5;color:#dce5ec;text-wrap:pretty;max-width:860px">{{ r.text }}</p>
          </div>
          <div style="padding:clamp(24px,3.5vw,36px);border-radius:24px;border:2px solid #4ff59a;background:rgba(79,245,154,.08);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px 40px">
            <div style="flex:1 1 360px;display:flex;flex-direction:column;gap:8px">
              <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#4ff59a;font-weight:700">Seu próximo passo</span>
              <span style="font-family:Sora,sans-serif;font-weight:700;font-size:clamp(20px,2.2vw,26px);line-height:1.3;text-wrap:pretty">{{ r.next }}</span>
            </div>
            <div style="flex:0 1 420px;display:flex;flex-direction:column;gap:10px">
              <a href="{{ waLink }}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;gap:12px;min-height:64px;padding:0 24px;border-radius:999px;background:#eef3f7;color:#06120b;font-weight:700;font-size:18px;text-align:center" style-hover="background:#ffffff;color:#06120b">
                <svg viewBox="0 0 24 24" style="width:22px;height:22px;flex:none;color:#12a150"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"></path></svg>
                Falar com um consultor no WhatsApp
              </a>
              <span style="text-align:center;font-size:14px;color:#b9c6d2">Uma pessoa de verdade, não um robô.</span>
            </div>
          </div>
        </div>
      </sc-if>

    </div>
  </div>

  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">
    <sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ back }}" style="display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;border:1.5px solid #4ff59a;background:rgba(79,245,154,.06);color:#4ff59a;font:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 0 22px rgba(79,245,154,.28)" style-hover="background:#4ff59a;color:#06120b">← Voltar</button>
    </sc-if>
    <sc-if value="{{ noBack }}" hint-placeholder-val="{{ true }}">
      <a href="./" style="display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;border:1.5px solid #4ff59a;background:rgba(79,245,154,.06);color:#4ff59a;font:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 0 22px rgba(79,245,154,.28)" style-hover="background:#4ff59a;color:#06120b">← Voltar</a>
    </sc-if>
    <div style="margin-left:auto;display:flex;flex-wrap:wrap;gap:12px">
      <sc-if value="{{ isResult }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ restart }}" style="display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#dce5ec;font:inherit;font-size:15px;font-weight:500;cursor:pointer" style-hover="border-color:#4ff59a;color:#4ff59a">↺ Refazer a jornada</button>
      </sc-if>
      <a href="./" style="display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#dce5ec;font:inherit;font-size:15px;font-weight:500;cursor:pointer" style-hover="border-color:#4ff59a;color:#4ff59a">← Voltar para a página inicial</a>
    </div>
  </div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const Q = {
  p1: { n: 1, pos: 8, title: 'Sua empresa já fez a solicitação no Credencia?', options: [['Ainda não', 'r1'], ['Comecei, mas está em rascunho', 'r1'], ['Sim, já enviei', 'p2']] },
  p2: { n: 2, pos: 25, title: 'Qual é a situação dos seus casos de uso?', options: [['Em análise pela SENATRAN', 'r2'], ['Aprovado em parte', 'r5'], ['Não aprovado', 'r4'], ['Aprovado', 'p3']] },
  p3: { n: 3, pos: 42, title: 'Sua empresa já contratou o serviço de dados do Serpro (Consulta Online ou Datavalid)?', options: [['Ainda não', 'r6'], ['Sim', 'p4']] },
  p4: { n: 4, pos: 58, title: 'Sua empresa já contratou uma GCC?', options: [['Ainda não', 'r7'], ['Sim', 'p5']] },
  p5: { n: 5, pos: 75, title: 'Sua operação já está em produção?', options: [['Ainda não', 'r8'], ['Sim', 'r9']] }
};
const R = {
  r1: { wa: 'Olá! Ainda não enviei os casos de uso ao Credencia. Quero o apoio da Quem Me Viu para estruturar o pedido.', stages: [0], title: 'Hora de começar pelo Credencia', text: 'Sua empresa ainda não enviou os casos de uso para a SENATRAN.', next: 'Fale com um consultor para estruturar seus casos de uso.' },
  r2: { wa: 'Olá! Meu pedido no Credencia está em análise. Quero já contratar e homologar a GCC com a Quem Me Viu.', stages: [0], title: 'Seu pedido está em análise', text: 'A SENATRAN tem até 60 dias para analisar. Você não precisa esperar para escolher sua GCC.', next: 'Fale com um consultor e já contrate e homologue a GCC durante a análise.' },
  r4: { wa: 'Olá! Meu pedido no Credencia não foi aprovado. Quero o apoio da Quem Me Viu para refazer o pedido.', stages: [0], title: 'Seu pedido não foi aprovado', text: 'É possível reestruturar os casos de uso e solicitar de novo.', next: 'Fale com um consultor para refazer o pedido.' },
  r5: { wa: 'Olá! Meu pedido no Credencia foi aprovado em parte. Quero o apoio da Quem Me Viu para avançar nas duas frentes.', stages: [0, 1], title: 'Seu pedido foi aprovado em parte', text: 'A parte aprovada já pode avançar. A outra precisa de ajustes.', next: 'Fale com um consultor para avançar nas duas frentes.' },
  r6: { wa: 'Olá! Meu pedido no Credencia foi aprovado. Quero contratar o Serpro e a Quem Me Viu como minha GCC.', stages: [1], title: 'Aprovado! Agora é contratar', text: 'Falta contratar o serviço de dados do Serpro e vincular a sua GCC.', next: 'Fale com um consultor para contratar o Serpro e já vincular a GCC.' },
  r7: { wa: 'Olá! Já tenho o Serpro e falta a GCC. Quero contratar a Quem Me Viu.', stages: [1], title: 'Falta só a GCC', text: 'Sua empresa já tem o Serpro. Sem uma GCC, a operação não começa.', next: 'Fale com um consultor e contrate a Quem Me Viu.' },
  r8: { wa: 'Olá! Estou na fase de integração e homologação com o Serpro. Quero o apoio da Quem Me Viu para entrar em produção.', stages: [2], title: 'Rumo à produção', text: 'Agora é integrar e homologar com o Serpro.', next: 'Fale com um consultor para a homologação.' },
  r9: { wa: 'Olá! Minha empresa já opera no novo modelo. Quero conhecer o suporte da Quem Me Viu e falar sobre novos casos de uso.', stages: [2], title: 'Operação em andamento', text: 'Sua empresa já consulta os dados no novo modelo.', next: 'Fale com um consultor sobre suporte e novos casos de uso.' }
};
const NAMES = ['Aprovação no Credencia', 'Contratação do Serpro e da GCC', 'Operação'];
const CENTER = [16.67, 50, 83.33];
const posStage = p => p < 33.33 ? 0 : p < 66.67 ? 1 : 2;

class Component extends DCLogic {
  state = { cur: 'p1', history: [], phase: 'idle', dir: 1 };
  headRef = React.createRef();
  componentDidMount() { this.mq = window.matchMedia('(prefers-reduced-motion: reduce)'); }
  componentWillUnmount() { clearTimeout(this.t); cancelAnimationFrame(this.raf); }
  reduce() { return !!(this.mq && this.mq.matches); }
  focusHead() { const h = this.headRef.current; h && h.focus({ preventScroll: true }); }
  go(next, history, dir) {
    if (this.busy) return;
    if (this.reduce()) { this.setState({ cur: next, history }, () => this.focusHead()); return; }
    this.busy = true;
    this.setState({ phase: 'out', dir });
    this.t = setTimeout(() => {
      this.setState({ cur: next, history, phase: 'pre' }, () => {
        this.raf = requestAnimationFrame(() => {
          this.raf = requestAnimationFrame(() => { this.setState({ phase: 'idle' }); this.busy = false; this.focusHead(); });
        });
      });
    }, 260);
  }
  renderVals() {
    const { cur, history, phase, dir } = this.state;
    const rd = this.reduce();
    const isQ = cur[0] === 'p';
    const q = isQ ? Q[cur] : null;
    const r = isQ ? null : R[cur];
    const pos = isQ ? q.pos : r.stages.length > 1 ? 33.33 : CENTER[r.stages[0]];
    const active = isQ ? [posStage(pos)] : r.stages;
    const stages = NAMES.map((name, i) => {
      const on = active.includes(i), done = !on && i < Math.min(...active);
      return {
        n: i + 1, name, here: !isQ && on,
        nodeBg: on ? '#4ff59a' : done ? '#173d5a' : '#10215a',
        nodeBorder: on || done ? '#4ff59a' : 'rgba(238,243,247,.2)',
        nodeColor: on ? '#06120b' : done ? '#4ff59a' : '#8fa0b1',
        color: on ? '#ffffff' : done ? '#dce5ec' : '#8fa0b1'
      };
    });
    const ease = 'cubic-bezier(.4,0,.2,1)';
    const off = 56 * dir;
    return {
      stages, headRef: this.headRef,
      markerLeft: pos + '%',
      markerOp: isQ ? 1 : 0,
      fillW: Math.max(0, pos - 16.67) + '%',
      markerTr: rd ? 'none' : `left .7s ${ease}, opacity .3s ease`,
      railTr: rd ? 'none' : `width .7s ${ease}`,
      panelTf: phase === 'out' ? `translateX(${-off}px)` : phase === 'pre' ? `translateX(${off}px)` : 'none',
      panelOp: phase === 'idle' ? 1 : 0,
      panelTr: rd || phase === 'pre' ? 'none' : 'transform .26s ease, opacity .26s ease',
      isQuestion: isQ, isResult: !isQ,
      qNum: q ? q.n : '',
      q: q ? { title: q.title, options: q.options.map(([label, to], i) => { const hi = (cur === 'p2' && label === 'Aprovado') || (cur === 'p4' && label === 'Ainda não'); return { label, bd: hi ? '1.5px solid #4ff59a' : '1px solid rgba(255,255,255,.14)', sh: hi ? '0 14px 36px -14px rgba(79,245,154,.6),0 0 24px rgba(79,245,154,.16)' : 'none', bg: hi ? 'rgba(79,245,154,.07)' : 'rgba(255,255,255,.04)', pick: () => this.go(to, [...history, cur], 1) }; }) } : { title: '', options: [] },
      r: r || {},
      waLink: r ? 'https://wa.me/5511926363815?text=' + encodeURIComponent(r.wa) : '#',
      canBack: history.length > 0,
      noBack: history.length === 0,
      back: () => history.length && this.go(history[history.length - 1], history.slice(0, -1), -1),
      restart: () => this.go('p1', [], -1)
    };
  }
}
</script>
<script src="consent.js" defer></script>
</body>
</html>
